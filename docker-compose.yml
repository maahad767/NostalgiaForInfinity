services:
  freqtrade:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.prod
    container_name: ${FREQTRADE__BOT_NAME:-prod}_${FREQTRADE__EXCHANGE__NAME:-binance}_${FREQTRADE__TRADING_MODE:-spot}-${FREQTRADE__STRATEGY:-NostalgiaForInfinityX7}
    restart: unless-stopped
    ports:
      - "${FREQTRADE__API_SERVER__LISTEN_PORT:-8080}:${FREQTRADE__API_SERVER__LISTEN_PORT:-8080}"
    volumes:
      # Configs and strategy are baked into the image (see docker/Dockerfile.custom)
      # because Coolify doesn't honor relative bind-mounts at runtime.
      - "freqtrade_userdata:/freqtrade/user_data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FREQTRADE__API_SERVER__LISTEN_PORT:-8080}"]
      interval: 90s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Configs loaded explicitly so the named volume can start empty.
    command: >
      trade
      -c configs/exampleconfig.json
      -c configs/exampleconfig_secret.json
      -c configs/trading_mode-${FREQTRADE__TRADING_MODE:-spot}.json
      -c configs/pairlist-volume-${FREQTRADE__EXCHANGE__NAME:-binance}-usdt.json
      -c configs/blacklist-${FREQTRADE__EXCHANGE__NAME:-binance}.json
      --strategy ${FREQTRADE__STRATEGY:-NostalgiaForInfinityX7}
      --strategy-path .
      --db-url sqlite:////freqtrade/user_data/${FREQTRADE__BOT_NAME:-prod}_${FREQTRADE__EXCHANGE__NAME:-binance}_${FREQTRADE__TRADING_MODE:-spot}-tradesv3.sqlite
      --log-file user_data/logs/${FREQTRADE__BOT_NAME:-prod}-${FREQTRADE__EXCHANGE__NAME:-binance}-${FREQTRADE__STRATEGY:-NostalgiaForInfinityX7}-${FREQTRADE__TRADING_MODE:-spot}.log
      -v

volumes:
  freqtrade_userdata:
